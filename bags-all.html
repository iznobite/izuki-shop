<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>IZUKI — ALL BAGS</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            padding: 100px 40px;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-bottom: 1px solid #222;
            padding-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 40px;
        }

        .item {
            background: #0a0a0a;
            border: 1px solid #111;
            padding: 15px;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        .item:hover {
            transform: translateY(-5px);
            border-color: #333;
        }

        .item img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .item-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 10px;
            gap: 15px;
        }

        .item-info-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
        }

        .item-name {
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .item-price {
            color: #777;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* Nút ADD Xịn hơn - Ghost Tech Style */
        .inline-add-btn {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.7rem;
            font-weight: bold;
            color: #ffffff;
            background: transparent;
            border: 1px solid #333333;
            cursor: pointer;
            text-transform: uppercase;
            padding: 8px 16px;
            letter-spacing: 1px;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .inline-add-btn:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        a {
            color: #666;
            text-decoration: none;
            font-size: 0.75rem;
            display: inline-block;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-link">← HOME</a>
    <h1>ALL BAGS COLLECTION</h1>
    <div class="grid" id="allBagsGrid"></div>

    <script src="js/products.js"></script>
    <script>
        const grid = document.getElementById('allBagsGrid');
        const productsData = JSON.parse(localStorage.getItem('izukiProducts')) || (typeof izukiProducts !== 'undefined' ? izukiProducts : []);
        const allBags = productsData.filter(product => product.category === "bags");

        allBags.forEach((bag, index) => {
            if (!bag.id) bag.id = index + 1000;
            const itemDiv = document.createElement('div');
            itemDiv.className = 'item';

            itemDiv.innerHTML = `
                <img src="${bag.image}">
                <div class="item-meta-row">
                    <div class="item-info-left">
                        <div class="item-name">${bag.name}</div>
                        <div class="item-price">€ ${bag.price}</div>
                    </div>
                    <button class="inline-add-btn">ADD TO BAG</button>
                </div>
            `;

            itemDiv.querySelector('.inline-add-btn').addEventListener('click', () => {
                // Nhánh 1: Nếu mở dạng nhúng (iframe)
                if (window.parent && window.parent.addToCartGlobal && window.parent !== window) {
                    window.parent.addToCartGlobal(bag);
                } else {
                    // Nhánh 2: Mở tab độc lập, lưu vào bộ nhớ cục bộ
                    let cart = JSON.parse(localStorage.getItem('izukiCart')) || [];
                    const exist = cart.find(item => item.id === bag.id);
                    if (exist) exist.quantity += 1;
                    else cart.push({ id: bag.id, name: bag.name, price: bag.price, image: bag.image, quantity: 1 });
                    
                    localStorage.setItem('izukiCart', JSON.stringify(cart));
                    
                    // Phát tín hiệu thông báo cho trang index.html mở drawer
                    localStorage.setItem('izukiCart_trigger', Date.now());
                }
            });
            grid.appendChild(itemDiv);
        });
    </script>
</body>

</html>
