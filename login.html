<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>IZUKI // ACCESS</title>
    <style>
        body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; }
        .login-box { border: 1px solid #333; padding: 40px; text-align: center; }
        input { background: #111; border: 1px solid #333; color: #fff; padding: 10px; width: 200px; margin-bottom: 20px; display: block; }
        button { background: #fff; color: #000; padding: 10px 40px; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>IZUKI // AUTH</h2>
        <input type="password" id="pass" placeholder="PASSWORD">
        <button onclick="checkPass()">[ENTER]</button>
    </div>

    <script>
        function checkPass() {
            const p = document.getElementById('pass').value;
            // Đặt mật khẩu ở đây (Ví dụ: izuki2026)
            if(p === "1234") {
                localStorage.setItem('admin_auth', 'true');
                window.location.href = 'admin.html';
            } else {
                alert('ACCESS DENIED');
            }
        }
    </script>
</body>
</html>
