<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>IZUKI — VOID SS26</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
        }

        body {
            background: #000;
            padding: 100px 40px;
        }

        a {
            color: #666;
            text-decoration: none;
            font-size: 0.75rem;
            display: inline-block;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: .3s;
        }

        a:hover {
            color: #fff;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-bottom: 1px solid #222;
            padding-bottom: 20px;
            font-weight: 500;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 40px;
        }

        .item {
            background: #050505;
            border: 1px solid #111;
            overflow: hidden;
            transition: border .4s ease, transform .4s ease;
        }

        .item:hover {
            border-color: #333;
            transform: translateY(-6px);
        }

        .item-image {
            width: 100%;
            height: 420px;
            overflow: hidden;
            background: #111;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .7s ease, opacity .7s ease;
        }

        .item:hover img {
            transform: scale(1.05);
            opacity: .85;
        }

        .item-content {
            padding: 22px;
        }

        .item-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 15px;
        }

        .item-info-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
        }

        .item-title {
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.4;
            color: #ddd;
        }

        .item-price {
            color: #777;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }

        /* Bộ nút Ghost Tech Style cao cấp lật màu cực mượt */
        .inline-add-btn {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.7rem;
            font-weight: bold;
            color: #ffffff;
            background: transparent;
            border: 1px solid #333333;
            cursor: pointer;
            text-transform: uppercase;
            padding: 8px 16px;
            letter-spacing: 1px;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .inline-add-btn:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .empty {
            color: #555;
            margin-top: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <a href="index.html">← HOME</a>
    <h1>COLLECTION: VOID [SS26]</h1>
    <div class="grid" id="voidGrid"></div>

    <script src="js/products.js"></script>
    <script>
        const grid = document.getElementById('voidGrid');
        const productsData = JSON.parse(localStorage.getItem('izukiProducts')) || (typeof izukiProducts !== 'undefined' ? izukiProducts : []);
        
        // Chuẩn chỉ: Lọc đúng category collections và subCategory void (Mùa Xuân Hè)
        const voidProducts = productsData.filter(product =>
            product.category === "collections" && product.subCategory === "void"
        );

        if (voidProducts.length === 0) {
            grid.innerHTML = `<div class="empty">NO VOID ITEMS AVAILABLE</div>`;
        }

        voidProducts.forEach((item, index) => {
            if (!item.id) item.id = index + 3000;
            const itemDiv = document.createElement('div');
            itemDiv.className = 'item';

            itemDiv.innerHTML = `
                <div class="item-image">
                    <img src="${item.image}">
                </div>
                <div class="item-content">
                    <div class="item-meta-row">
                        <div class="item-info-left">
                            <div class="item-title">${item.name}</div>
                            <div class="item-price">€ ${item.price}</div>
                        </div>
                        <button class="inline-add-btn">ADD TO BAG</button>
                    </div>
                </div>
            `;

            // Khắc phục lỗi bắt sự kiện click cho trang con độc lập
            itemDiv.querySelector('.inline-add-btn').addEventListener('click', () => {
                if (window.parent && window.parent.addToCartGlobal && window.parent !== window) {
                    window.parent.addToCartGlobal(item);
                } else {
                    let cart = JSON.parse(localStorage.getItem('izukiCart')) || [];
                    const exist = cart.find(i => i.id === item.id);
                    if (exist) exist.quantity += 1;
                    else cart.push({ id: item.id, name: item.name, price: item.price, image: item.image, quantity: 1 });
                    
                    localStorage.setItem('izukiCart', JSON.stringify(cart));
                    localStorage.setItem('izukiCart_trigger', Date.now()); // Đồng bộ kích hoạt mở nhanh giỏ hàng trang chủ
                }
            });
            grid.appendChild(itemDiv);
        });
    </script>
</body>

</html>
